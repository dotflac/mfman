[project]
name = "mfman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dotflac", email = "dotflac@tuta.io" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "replicate>=1.0.7",
]

[project.scripts]
mfman = "mfman:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]
